[project]
name = "forge"
version = "0.1.0"
description = "TediForge collaborative multimodal orchestration runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.28.0,<1.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "jsonschema>=4.20,<5.0",
    "python-dotenv>=1.0.1,<2.0",
    "PyYAML>=6.0,<7.0",
    "ddgs>=9.0.0,<10.0",
    "huggingface_hub>=0.25.0,<2.0",
    "torch>=2.2.0,<3.0",
    "transformers>=4.49.0,<5.0",
    "diffusers>=0.30.0,<1.0",
    "sentence-transformers>=3.0.0,<6.0",
    "faster-whisper>=1.1.0,<2.0",
    "piper-tts>=1.2.0,<2.0",
    "pandas>=2.2.0,<3.0",
    "openpyxl>=3.1.0,<4.0",
    "matplotlib>=3.8.0,<4.0",
    "pypdf>=5.0.0,<7.0",
    "Pillow>=10.0.0,<13.0",
    "pytesseract>=0.3.10,<0.4",
    "sqlalchemy>=2.0.0,<3.0",
    "opentelemetry-api>=1.26.0,<2.0",
    "opentelemetry-sdk>=1.26.0,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.skills" = ["**/*.md"]
"orchestrator.computer" = ["policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "config", "tests"]
extraPaths = ["src"]

[tool.unittest]
start-directory = "tests"
